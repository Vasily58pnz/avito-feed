name: Update Avito Feed

on:
  schedule:
    # Запуск каждый час (минута 0)
    - cron: '0 * * * *'
  workflow_dispatch: # Кнопка для ручного запуска

permissions:
  contents: write # Разрешает боту сохранять готовые файлы обратно

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Загрузка файлов
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Запуск парсера
        run: python avito_feed_generator.py

      - name: Сохранение XML-файла и карты ID
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add avito_feed.xml id_map.json
          git commit -m "Автоматическое обновление фида и базы ID [skip ci]" || echo "Изменений нет"
          git push
